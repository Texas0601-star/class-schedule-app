name: 构建 Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # 不要用 android-actions/setup-android。
      # 它内部会执行 `sdkmanager tools`，但 tools 包已从 SDK 仓库移除，
      # 结果必然报 "Failed to find package 'tools'" 并以退出码 1 结束。
      # ubuntu-latest 的 runner 已预装 Android SDK 与 cmdline-tools，
      # 用预装的那份即可，无需再装。
      - name: 确认 Android SDK 可用
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "(platforms 留待 Gradle 自动下载)"

      - name: 安装 npm 依赖
        run: npm ci

      - name: 同步 Capacitor 资源与插件
        run: npx cap sync android

      - name: 确保 gradlew 可执行
        working-directory: android
        run: chmod +x ./gradlew

      - name: 构建调试版 APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传调试版 APK
        uses: actions/upload-artifact@v4
        with:
          name: 课表-调试版-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
